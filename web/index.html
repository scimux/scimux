<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scimux</title>
<link rel="stylesheet" href="/assets/pico.min.css">
<style>
  /* Theme tokens */
  :root {
    --bg: #0e1116;
    --panel: #161b22;
    --border: #2d333b;
    --fg: #d7dde4;
    --dim: #8b949e;
    --accent: #4da3ff;
    --warn: #d29922;
    --bad: #f85149;
  }

  /* Page shell */
  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.5 system-ui, -apple-system, sans-serif;
  }

  header {
    position: sticky;
    top: 0;
    z-index: 5;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 14px;
    padding: 10px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }

  header h1 { margin: 0; font-size: 16px; }
  header h1 span { color: var(--accent); }
  #sys { color: var(--dim); font-size: 12px; }
  .spacer { flex: 1; }

  main {
    max-width: 980px;
    margin: 0 auto;
    padding: 14px;
  }

  .empty { padding: 60px 20px; color: var(--dim); text-align: center; }

  /* Shared controls */
  button {
    padding: 6px 12px;
    color: var(--fg);
    font-size: 13px;
    cursor: pointer;
    background: #21262d;
    border: 1px solid var(--border);
    border-radius: 6px;
  }

  button:hover { border-color: var(--accent); }
  button.primary { color: var(--accent); border-color: var(--accent); }

  /* Node tree */
  .node {
    margin: 8px 0;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
  }

  .nhead {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    cursor: pointer;
  }

  .nhead .arrow { width: 14px; color: var(--dim); }
  .nhead .title { font-weight: 600; }
  .nhead .meta { color: var(--dim); font-size: 12px; }
  .nbody { padding: 12px; border-top: 1px solid var(--border); }
  .rationale { margin-bottom: 8px; color: var(--warn); font-size: 12px; }

  /* Node state */
  .live {
    margin-left: auto;
    padding: 1px 8px;
    color: var(--dim);
    font-size: 11px;
    border: 1px solid var(--border);
    border-radius: 10px;
  }

  .live.active { color: var(--accent); border-color: var(--accent); }
  .live.exited, .live.unavailable { color: var(--bad); border-color: var(--bad); }

  .attn {
    padding: 1px 8px;
    color: #0e1116;
    font-size: 11px;
    font-weight: 600;
    background: var(--warn);
    border: 1px solid var(--warn);
    border-radius: 10px;
  }

  .inbox { border-color: var(--warn); }

  /* Conversation and pane */
  .chat {
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 52vh;
    padding: 4px 2px;
    overflow-y: auto;
  }

  .turn {
    max-width: 88%;
    padding: 8px 12px;
    white-space: pre-wrap;
    overflow-wrap: break-word;
    border-radius: 10px;
  }

  .turn.user { align-self: flex-end; background: #1f3a5f; }
  .turn.assistant { align-self: flex-start; background: #21262d; }
  .turn .who { margin-bottom: 2px; color: var(--dim); font-size: 11px; }
  .pending { padding: 10px; color: var(--dim); font-style: italic; }

  .peek {
    max-height: 52vh;
    margin-top: 8px;
    padding: 10px;
    overflow: auto;
    font: 12px/1.35 ui-monospace, monospace;
    white-space: pre-wrap;
    background: #010409;
    border: 1px solid var(--border);
    border-radius: 6px;
  }

  /* Prompt and pane actions */
  .sendrow { display: flex; gap: 8px; margin-top: 10px; }

  .sendrow textarea {
    flex: 1;
    min-height: 38px;
    padding: 8px 10px;
    color: var(--fg);
    font: inherit;
    resize: vertical;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
  }

  .tools { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .tools .hint { align-self: center; color: var(--dim); font-size: 12px; }
  .keys { align-items: center; }
  .keys button { min-width: 38px; }

  /* Dialogs */
  dialog {
    width: min(520px, 94vw);
    color: var(--fg);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
  }

  dialog::backdrop { background: rgba(0, 0, 0, .55); }
  dialog h3 { margin: 4px 0 0; }
  dialog label { display: block; margin: 10px 0 3px; color: var(--dim); font-size: 13px; }

  dialog input,
  dialog select,
  dialog textarea {
    width: 100%;
    padding: 7px;
    color: var(--fg);
    font: inherit;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
  }

  dialog .row { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
  dialog .cols { display: flex; gap: 10px; }
  dialog .cols > div { flex: 1; }
</style>
</head>
<body>
<!-- Application chrome -->
<header>
  <h1>sci<span>mux</span></h1>
  <span id="sys"></span>
  <div class="spacer"></div>
  <button class="primary" onclick="newChatDlg('')">+ new chat</button>
</header>

<!-- Node tree and expanded chat views are rendered here. -->
<main id="list">
  <div class="empty">loading…</div>
</main>

<!-- New, fork, and adoption flows share this one native dialog. -->
<dialog id="dlg">
  <form method="dialog">
    <h3 id="dlgTitle"></h3>
    <div id="dlgFields"></div>
    <div class="row">
      <button value="cancel" type="submit">cancel</button>
      <button value="ok" type="submit" class="primary">start</button>
    </div>
  </form>
</dialog>

<script>
/* ---- shared state and helpers ---- */

const $ = s => document.querySelector(s);

let nodes = [];
let unadopted = [];
let open = new Set();
let peeks = new Set();
let SOCKET = 'scimux';
let lastSig = '';

const api = (path, opts) => fetch(path, opts).then(async r => {
  if (!r.ok) throw new Error(await r.text());
  return r.headers.get('content-type')?.includes('json') ? r.json() : r.text();
});

const esc = s => {
  const d = document.createElement('div');
  d.textContent = s ?? '';
  return d.innerHTML;
};

/* ---- render preservation ----
   Polling must never clobber typing: render() preserves input values, focus,
   and cursor, while refresh() skips rendering unless visible state changed. */

function withInputsPreserved(fn) {
  const vals = {};
  document.querySelectorAll('#list input, #list textarea').forEach(el => {
    if (el.id && el.value) vals[el.id] = el.value;
  });
  const act = document.activeElement;
  const focus = act && act.id && (act.tagName === 'TEXTAREA' || act.tagName === 'INPUT')
    ? { id: act.id, start: act.selectionStart, end: act.selectionEnd } : null;
  fn();
  for (const [id, v] of Object.entries(vals)) {
    const el = document.getElementById(id);
    if (el && !el.value) el.value = v;
  }
  if (focus) {
    const el = document.getElementById(focus.id);
    if (el) { el.focus(); try { el.setSelectionRange(focus.start, focus.end); } catch {} }
  }
}

function render() {
  withInputsPreserved(renderInner);
}

/* ---- tree rendering ---- */

function renderInner() {
  const kids = {};
  nodes.forEach(n => (kids[n.parent || ''] ||= []).push(n));
  const known = new Set(nodes.map(n => n.id));
  const roots = nodes.filter(n => !n.parent || !known.has(n.parent));
  const one = (n, depth) => `
    <div class="node" style="margin-left:${depth * 22}px" id="node-${esc(n.id)}">
      <div class="nhead" onclick="toggle('${esc(n.id)}')">
        <span class="arrow">${open.has(n.id) ? '▾' : '▸'}</span>
        <span class="title">${esc(n.title)}</span>
        <span class="meta">${esc(n.agent)}${n.model ? ' · ' + esc(n.model) : ''}${n.effort ? ' · ' + esc(n.effort) : ''}</span>
        ${n.attention ? `<span class="attn" style="margin-left:auto">⚠ ${esc(n.attention)}</span>` : ''}
        <span class="live ${esc(n.live)}" ${n.attention ? 'style="margin-left:0"' : ''}>${esc(n.live)}</span>
      </div>
      ${open.has(n.id) ? body(n) : ''}
    </div>` + (kids[n.id] || []).map(c => one(c, depth + 1)).join('');
  const needs = nodes.filter(n => n.attention);
  const inboxStrip = needs.length ? `
    <div class="node inbox">
      <div class="nhead" style="cursor:default">
        <span class="meta">waiting for you:</span>
        ${needs.map(n => `<button onclick="openNode('${esc(n.id)}')">⚠ ${esc(n.title)} · ${esc(n.attention)}</button>`).join(' ')}
      </div>
    </div>` : '';
  const adoptStrip = unadopted.length ? `
    <div class="node" style="border-style:dashed">
      <div class="nhead" style="cursor:default">
        <span class="meta">unadopted tmux sessions on this socket:</span>
        ${unadopted.map(s => `<button onclick="adoptDlg('${esc(s)}')">adopt ${esc(s)}</button>`).join(' ')}
      </div>
    </div>` : '';
  $('#list').innerHTML = inboxStrip + adoptStrip + (nodes.length
    ? roots.map(n => one(n, 0)).join('')
    : `<div class="empty">No chats yet.<br><br>
       <button class="primary" onclick="newChatDlg('')">start your first chat</button></div>`);
  for (const id of open) fillChat(id);
}

function body(n) {
  // A node that waits for input shows the pane (so the dialog is readable)
  // and a key row to answer it without attaching to tmux.
  const KEYS = { Up: '↑', Down: '↓', Escape: 'Esc', Enter: '⏎' };
  return `<div class="nbody" onclick="event.stopPropagation()">
    ${n.rationale ? `<div class="rationale">why: ${esc(n.rationale)}</div>` : ''}
    <div class="chat" id="chat-${esc(n.id)}"><div class="pending">loading transcript…</div></div>
    <div class="peek" id="peek-${esc(n.id)}" style="display:${peeks.has(n.id) || n.attention ? 'block' : 'none'}"></div>
    ${n.attention ? `<div class="tools keys">
      <span class="hint">⚠ agent waits for your ${esc(n.attention)}:</span>
      ${['1','2','3','4','y','n','Up','Down','Enter','Escape'].map(k =>
        `<button onclick="sendKey('${esc(n.id)}','${k}')">${KEYS[k] || k}</button>`).join('')}
    </div>` : ''}
    <div class="sendrow">
      <textarea id="send-${esc(n.id)}" placeholder="prompt… (Enter sends, Shift+Enter for newline)"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendPrompt('${esc(n.id)}')}"></textarea>
      <button class="primary" onclick="sendPrompt('${esc(n.id)}')">send</button>
    </div>
    <div class="tools">
      <button onclick="newChatDlg('${esc(n.id)}')">⑂ fork</button>
      <button onclick="togglePeek('${esc(n.id)}')">tmux peek</button>
      <span class="hint">attach: <code>tmux -L ${esc(SOCKET)} attach -t ${esc(n.id)}</code></span>
    </div>
  </div>`;
}

function toggle(id) {
  open.has(id) ? open.delete(id) : open.add(id);
  render();
}

/* ---- state polling and transcript reads ---- */

async function refresh() {
  try {
    const st = await api('/api/state');
    nodes = st.nodes || [];
    unadopted = st.unadopted || [];
    SOCKET = st.socket || 'scimux';
    $('#sys').textContent = [st.sys?.load ? 'load ' + st.sys.load : '', st.sys?.mem || '']
      .filter(Boolean).join(' · ');
    // Tab-title badge: visible from any other tab/space when an agent blocks.
    const waiting = nodes.filter(n => n.attention).length;
    document.title = (waiting ? `(${waiting}) ` : '') + 'scimux';
    // Re-render only when something visible actually changed.
    const sig = JSON.stringify([st.nodes, st.unadopted]);
    if (sig !== lastSig) { lastSig = sig; render(); }
  } catch { $('#sys').textContent = 'server unreachable'; }
}

async function fillChat(id) {
  const el = $('#chat-' + CSS.escape(id));
  if (!el) return;
  try {
    const d = await api(`/api/nodes/${id}/chat`);
    if (d.pending && !d.turns.length) {
      el.innerHTML = '<div class="pending">waiting for the agent\'s transcript file… (peek shows the raw session)</div>';
      return;
    }
    const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 60;
    el.innerHTML = d.turns.map(t => `
      <div class="turn ${esc(t.role)}"><div class="who">${esc(t.role)}</div>${esc(t.text)}</div>`).join('')
      + (d.live === 'active' ? '<div class="pending">agent is working…</div>' : '');
    if (atBottom) el.scrollTop = el.scrollHeight;
  } catch {}
}

async function refreshPeeks() {
  for (const id of open) {
    const el = $('#peek-' + CSS.escape(id));
    if (!el || el.style.display === 'none') continue;
    try { el.textContent = await api(`/api/nodes/${id}/peek`); el.scrollTop = el.scrollHeight; }
    catch {}
  }
}

/* ---- node actions ---- */

function togglePeek(id) {
  peeks.has(id) ? peeks.delete(id) : peeks.add(id);
  const el = $('#peek-' + CSS.escape(id));
  const on = peeks.has(id) || nodes.some(n => n.id === id && n.attention);
  el.style.display = on ? 'block' : 'none';
  refreshPeeks();
}

function openNode(id) {
  open.add(id);
  render();
  const el = $('#node-' + CSS.escape(id));
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

async function sendKey(id, key) {
  try { await api(`/api/nodes/${id}/key`, { method: 'POST', body: JSON.stringify({ key }) }); }
  catch (e) { alert(e.message); }
}

async function sendPrompt(id) {
  const ta = $('#send-' + CSS.escape(id));
  const text = ta.value.trim();
  if (!text) return;
  ta.value = '';
  try { await api(`/api/nodes/${id}/send`, { method: 'POST', body: JSON.stringify({ text }) }); }
  catch (e) { alert(e.message); ta.value = text; }
}

/* ---- new chat and fork dialog ----
   A fork inherits launch configuration but always starts with fresh context. */

function newChatDlg(parent) {
  const isFork = parent !== '';
  $('#dlgTitle').textContent = isFork ? `fork ${parent} (fresh context)` : 'new chat';
  $('#dlgFields').innerHTML = `
    ${isFork ? `<label>why this fork? (decision rationale)</label>
                <textarea id="f_rationale" rows="2"></textarea>` : ''}
    <label>prompt / research question</label>
    <textarea id="f_prompt" rows="4" required></textarea>
    <div class="cols">
      <div><label>agent</label>
        <select id="f_agent"><option value="">${isFork ? '(inherit)' : 'claude'}</option>
          ${isFork ? '<option>claude</option>' : ''}<option>codex</option></select></div>
      <div><label>model ${isFork ? '(inherit)' : '(optional)'}</label><input id="f_model"></div>
      <div><label>effort (codex)</label>
        <select id="f_effort"><option value=""></option><option>low</option>
          <option>medium</option><option>high</option></select></div>
    </div>
    <label>working directory ${isFork ? '(inherit)' : ''}</label>
    <input id="f_dir" placeholder="${isFork ? '' : '/path/to/experiment'}">
    <label>title (optional)</label><input id="f_title">`;
  const dlg = $('#dlg');
  dlg.onclose = async () => {
    if (dlg.returnValue !== 'ok') return;
    const payload = {
      parent, prompt: $('#f_prompt').value.trim(),
      rationale: isFork ? $('#f_rationale').value.trim() : '',
      agent: $('#f_agent').value, model: $('#f_model').value.trim(),
      effort: $('#f_effort').value, dir: $('#f_dir').value.trim(),
      title: $('#f_title').value.trim(),
    };
    if (!payload.prompt) return;
    try {
      const n = await api('/api/nodes', { method: 'POST', body: JSON.stringify(payload) });
      open.add(n.id);
      await refresh();
    } catch (e) { alert(e.message); }
  };
  dlg.showModal();
}

/* ---- adoption dialog ---- */

function adoptDlg(session) {
  $('#dlgTitle').textContent = `adopt session "${session}"`;
  $('#dlgFields').innerHTML = `
    <label>agent running inside it</label>
    <select id="a_agent"><option>claude</option><option>codex</option></select>
    <label>claude session id (optional — if empty, scimux takes the newest session log in the pane's working directory)</label>
    <input id="a_sid" placeholder="uuid, auto-discovered if empty">
    <label>transcript path (optional override if known)</label>
    <input id="a_path">
    <label>title (optional)</label><input id="a_title">
    <label>what is this session working on? (recorded as the node's question)</label>
    <textarea id="a_prompt" rows="2"></textarea>`;
  const dlg = $('#dlg');
  dlg.onclose = async () => {
    if (dlg.returnValue !== 'ok') return;
    try {
      const n = await api('/api/adopt', { method: 'POST', body: JSON.stringify({
        session, agent: $('#a_agent').value, session_id: $('#a_sid').value.trim(),
        transcript: $('#a_path').value.trim(), title: $('#a_title').value.trim(),
        prompt: $('#a_prompt').value.trim(),
      })});
      open.add(n.id); await refresh();
    } catch (e) { alert(e.message); }
  };
  dlg.showModal();
}

/* ---- startup polling ---- */

refresh();
setInterval(refresh, 2500);
setInterval(() => { for (const id of open) fillChat(id); refreshPeeks(); }, 2000);
</script>
</body>
</html>
