on:
  release:
    types:
      - published
env:
  CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
jobs:
  build-and-test-and-release:
    runs-on: go-builder
    steps:
      - name: Add missing tools
        run: |
          apk add --no-cache bash curl file git jq nodejs

      - name: Clone and checkout repository
        run: |
          git clone https://codeberg.org/chrberger/scimux.git .
          git checkout ${{ github.sha }}
          mkdir -p builds

      # A vulnerability gate, not a vulnerability report. govulncheck's JSON
      # mode exits zero while listing findings, so this uses the default mode,
      # whose non-zero exit is the whole point; a scan whose result nobody acts
      # on is how twelve advisories against the build inputs went unnoticed
      # through green builds.
      #
      # The scanner is a development tool and deliberately not a build
      # dependency: it is installed here and appears in no go.mod. GOTOOLCHAIN
      # and GOFLAGS are cleared only for building the scanner, which tracks a
      # newer Go than this project targets — the scan itself still reports
      # against the toolchain that builds scimux.
      - name: Scan build inputs for known vulnerabilities
        run: |
          env GOFLAGS= GOTOOLCHAIN=auto go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./cmd/scimux

      - name: Run tests (short mode; integration tests need tmux and are skipped)
        run: |
          go test -short ./...

      - name: Run JavaScript tests (Node 22+)
        run: |
          node -e 'const major = Number(process.versions.node.split(".")[0]); if (major < 22) { console.error(`Node 22+ required; found ${process.versions.node}`); process.exit(1); }'
          node --test web/test/*.test.js

      - name: Build for linux/amd64
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "-X main.version=${{ forgejo.ref_name }}" -o builds/scimux-linux-amd64 ./cmd/scimux && file builds/scimux-linux-amd64

      - name: Build for linux/arm64
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags "-X main.version=${{ forgejo.ref_name }}" -o builds/scimux-linux-arm64 ./cmd/scimux && file builds/scimux-linux-arm64

      - name: Build for darwin/arm64
        run: |
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags "-X main.version=${{ forgejo.ref_name }}" -o builds/scimux-darwin-arm64 ./cmd/scimux && file builds/scimux-darwin-arm64

      - name: Build for darwin/amd64
        run: |
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags "-X main.version=${{ forgejo.ref_name }}" -o builds/scimux-darwin-amd64 ./cmd/scimux && file builds/scimux-darwin-amd64

      # What actually built the artifacts, recorded where a later triage can
      # read it. The go directive is a language floor, so "go 1.25.0" says
      # nothing about which patched toolchain a runner selected, and an
      # advisory assessment that cannot name the toolchain is guesswork.
      - name: Record the toolchain that built the artifacts
        run: |
          go version
          for f in builds/scimux-*; do go version -m "$f" | head -n 2; done

      - name: Generate checksums
        run: |
          cd builds && sha256sum scimux-* > SHA256SUMS && cat SHA256SUMS

      - name: Attach built artifacts
        run: |
          .forgejo/codeberg-release.sh "${{ forgejo.ref_name }}" ./builds
