on:
  release:
    types:
      - published
env:
  CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
jobs:
  build-and-test-and-release:
    runs-on: go-builder
    steps:
      - name: Add missing tools
        run: |
          apk add --no-cache bash curl file git jq

      - name: Clone and checkout repository
        run: |
          git clone https://codeberg.org/chrberger/scimux.git .
          git checkout ${{ github.sha }}
          mkdir -p builds

      - name: Run tests (short mode; integration tests need tmux and are skipped)
        run: |
          go test -short ./...

      - name: Build for linux/amd64
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "-X main.version=${{ forgejo.ref_name }}" -o builds/scimux-linux-amd64 && file builds/scimux-linux-amd64

      - name: Build for linux/arm64
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags "-X main.version=${{ forgejo.ref_name }}" -o builds/scimux-linux-arm64 && file builds/scimux-linux-arm64

      - name: Build for darwin/arm64
        run: |
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags "-X main.version=${{ forgejo.ref_name }}" -o builds/scimux-darwin-arm64 && file builds/scimux-darwin-arm64

      - name: Build for darwin/amd64
        run: |
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags "-X main.version=${{ forgejo.ref_name }}" -o builds/scimux-darwin-amd64 && file builds/scimux-darwin-amd64

      - name: Generate checksums
        run: |
          cd builds && sha256sum scimux-* > SHA256SUMS && cat SHA256SUMS

      - name: Attach built artifacts
        run: |
          .forgejo/codeberg-release.sh "${{ forgejo.ref_name }}" ./builds
