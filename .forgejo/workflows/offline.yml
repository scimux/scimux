# AT-NFR-08-a — the offline test job.
#
# NFR-08: `go test -short ./...` must pass with a warm module cache, no network
# route, no tmux and no rendezvous. The acceptance test is explicit that this
# runs *in CI with the network disabled*, "not as a manual check" — a developer
# unplugging their ethernet once does not keep the property true.
#
# The module cache is warmed WITH network first: a cold clone must still fetch
# the dependency tree, which NFR-08 calls the cost of NFR-02 rather than a test
# failure. The test step establishes and verifies its network namespace:
# loopback stays up and the caller's uid does not change. It fails if
# isolation is unavailable; it must never fall back to a networked run.
on:
  push:
    branches:
      - "**"
jobs:
  offline-tests:
    runs-on: go-builder
    steps:
      - name: Add missing tools
        run: |
          apk add --no-cache bash curl jq file git nodejs util-linux iproute2

      - name: Clone and checkout repository
        # A ${{ }} expression is substituted into the script as text before
        # any shell parses it, so it must never appear inside a run block:
        # the value reaches the shell as a variable instead.
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -eu
          git clone https://codeberg.org/chrberger/scimux.git .
          case "$COMMIT_SHA" in
            *[!0-9a-f]* | "") echo "not a commit id: $COMMIT_SHA" >&2; exit 1 ;;
          esac
          git checkout "$COMMIT_SHA"

      - name: Warm the module cache (network required, and allowed here)
        run: |
          go mod download all
          # Build while the network is still up, so a toolchain or module
          # download can never masquerade as an offline test failure.
          go build ./...

      - name: Go and Node tests, offline
        run: |
          set -eu
          OUTER_UID="$(id -u)"
          export OUTER_UID

          # Mapping to root would bypass the suite's file-permission tests.
          if unshare -n true 2>/dev/null; then
            NS="unshare -n"
          elif unshare --user --map-current-user --net true 2>/dev/null; then
            NS="unshare --user --map-current-user --net"
          else
            echo "FAIL: cannot isolate the network without remapping the user" >&2
            exit 1
          fi

          $NS sh -c '
            set -eu
            ip link set lo up
            if [ "$(id -u)" != "$OUTER_UID" ]; then
              echo "FAIL: uid changed inside the namespace" >&2
              exit 1
            fi
            if ! ip addr show lo | grep -q "127.0.0.1"; then
              echo "FAIL: loopback has no address" >&2
              exit 1
            fi
            if nc -z -w 3 1.1.1.1 443 2>/dev/null; then
              echo "FAIL: an off-host address is reachable" >&2
              exit 1
            fi
            echo "offline tests: loopback up, uid preserved, no route off-host"
            GOPROXY=off GOFLAGS=-mod=readonly go test -short ./...
            node -e "const major = Number(process.versions.node.split(\".\")[0]); if (major < 22) { console.error(\"Node 22+ required\"); process.exit(1); }"
            node --test web/test/*.test.js
          '
