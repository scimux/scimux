on:
  push:
    branches:
      - "**"
jobs:
  build-and-test:
    runs-on: go-builder
    steps:
      - name: Add missing tools
        run: |
          apk add --no-cache file git nodejs

      - name: Clone and checkout repository
        run: |
          git clone https://codeberg.org/chrberger/scimux.git .
          git checkout ${{ github.sha }}
          mkdir -p builds

      - name: Run tests (short mode; integration tests need tmux and are skipped)
        run: |
          go test -short ./...

      - name: Run JavaScript tests (Node 22+)
        run: |
          node -e 'const major = Number(process.versions.node.split(".")[0]); if (major < 22) { console.error(`Node 22+ required; found ${process.versions.node}`); process.exit(1); }'
          node --test web/test/*.test.js

      - name: Build for linux/amd64
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "-X main.version=$(git rev-parse --short HEAD)" -o builds/scimux-linux-amd64 && file builds/scimux-linux-amd64

      - name: Build for linux/arm64
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags "-X main.version=$(git rev-parse --short HEAD)" -o builds/scimux-linux-arm64 && file builds/scimux-linux-arm64

      - name: Build for darwin/arm64
        run: |
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags "-X main.version=$(git rev-parse --short HEAD)" -o builds/scimux-darwin-arm64 && file builds/scimux-darwin-arm64

      - name: Build for darwin/amd64
        run: |
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags "-X main.version=$(git rev-parse --short HEAD)" -o builds/scimux-darwin-amd64 && file builds/scimux-darwin-amd64
