on:
  push:
    branches:
      - "**"
jobs:
  build-and-test:
    runs-on: go-builder
    steps:
      - name: Add missing tools
        run: |
          apk add --no-cache file git nodejs tmux

      - name: Clone and checkout repository
        # A ${{ }} expression is substituted into the script as text before
        # any shell parses it, so it must never appear inside a run block:
        # the value reaches the shell as a variable instead.
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -eu
          git clone https://codeberg.org/chrberger/scimux.git .
          case "$COMMIT_SHA" in
            *[!0-9a-f]* | "") echo "not a commit id: $COMMIT_SHA" >&2; exit 1 ;;
          esac
          git checkout "$COMMIT_SHA"
          mkdir -p builds

      # A vulnerability gate, not a vulnerability report. govulncheck's JSON
      # mode exits zero while listing findings, so this uses the default mode,
      # whose non-zero exit is the whole point; a scan whose result nobody acts
      # on is how twelve advisories against the build inputs went unnoticed
      # through green builds.
      #
      # The scanner is a development tool and deliberately not a build
      # dependency: it is installed here and appears in no go.mod. GOTOOLCHAIN
      # and GOFLAGS are cleared only for building the scanner, which tracks a
      # newer Go than this project targets — the scan itself still reports
      # against the toolchain that builds scimux.
      - name: Scan build inputs for known vulnerabilities
        run: |
          env GOFLAGS= GOTOOLCHAIN=auto go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./cmd/scimux

      - name: Run tests (unit and integration; tmux installed above)
        run: |
          go test -timeout 20m ./...

      - name: Run JavaScript tests (Node 22+)
        run: |
          node -e 'const major = Number(process.versions.node.split(".")[0]); if (major < 22) { console.error(`Node 22+ required; found ${process.versions.node}`); process.exit(1); }'
          node --test web/test/*.test.js

      - name: Build for linux/amd64
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "-X main.version=$(git rev-parse --short HEAD)" -o builds/scimux-linux-amd64 ./cmd/scimux && file builds/scimux-linux-amd64

      - name: Build for linux/arm64
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags "-X main.version=$(git rev-parse --short HEAD)" -o builds/scimux-linux-arm64 ./cmd/scimux && file builds/scimux-linux-arm64

      - name: Build for darwin/arm64
        run: |
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags "-X main.version=$(git rev-parse --short HEAD)" -o builds/scimux-darwin-arm64 ./cmd/scimux && file builds/scimux-darwin-arm64

      - name: Build for darwin/amd64
        run: |
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags "-X main.version=$(git rev-parse --short HEAD)" -o builds/scimux-darwin-amd64 ./cmd/scimux && file builds/scimux-darwin-amd64

      # freebsd is built but not released. AGENTS.md states that the FreeBSD
      # static build keeps working, and TestCrossBuildTargets derives its whole
      # matrix from these files — so without this step the claim is defended by
      # nothing. The same gap is what let the darwin builds stay broken.
      - name: Build for freebsd/amd64
        run: |
          CGO_ENABLED=0 GOOS=freebsd GOARCH=amd64 go build -ldflags "-X main.version=$(git rev-parse --short HEAD)" -o builds/scimux-freebsd-amd64 ./cmd/scimux && file builds/scimux-freebsd-amd64
