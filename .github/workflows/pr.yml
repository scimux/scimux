name: PR checks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  test:
    name: PR tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the PR merge commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.8'
          cache: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bash curl jq file git tmux
      - name: Run Go tests including integration and cross-builds
        run: go test -timeout 20m ./...
      - name: Run JavaScript tests
        run: |
          node -e 'const major = Number(process.versions.node.split(".")[0]); if (major < 22) { console.error("Node 22+ required"); process.exit(1); }'
          node --test web/test/*.test.js
